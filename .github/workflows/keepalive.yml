# Hält das kostenlose Supabase-Projekt aktiv (Free-Tarif pausiert nach 7 Tagen ohne Aktivität).
# Hinweis: Dies ist ein kostenloser Workaround ohne Garantie. Der Lauf wird im Protokoll sichtbar.
# GitHub deaktiviert geplante Workflows in öffentlichen Repositories nach 60 Tagen ohne Aktivität.
# Dagegen hilft jeder Commit oder ein manueller Start ("Run workflow").
name: Supabase Keepalive

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_ANON_KEY", "")
          if not url:
              print("::error::GitHub Actions Secret SUPABASE_URL fehlt.")
              sys.exit(1)
          if not key:
              print("::error::GitHub Actions Secret SUPABASE_ANON_KEY fehlt.")
              sys.exit(1)

          request = urllib.request.Request(
              url + "/rest/v1/resources?select=id&limit=1",
              headers={"apikey": key, "Authorization": "Bearer " + key},
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  body = response.read(1000).decode("utf-8", errors="replace")
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read(1000).decode("utf-8", errors="replace")
          except Exception as error:
              print("::error::Supabase-Anfrage fehlgeschlagen: " + str(error))
              sys.exit(1)

          print("Antwort HTTP " + str(status))
          print(body)
          if status != 200:
              print("::error::Supabase Keepalive erwartet HTTP 200; URL, anon key, RLS und Projektstatus prüfen.")
              sys.exit(1)
          PY
