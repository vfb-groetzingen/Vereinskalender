# Hält das kostenlose Supabase-Projekt aktiv (Free-Tarif pausiert nach 7 Tagen ohne Aktivität).
# Hinweis: Dies ist ein kostenloser Workaround ohne Garantie. Der Lauf wird im Protokoll sichtbar.
# GitHub deaktiviert geplante Workflows in öffentlichen Repositories nach 60 Tagen ohne Aktivität.
# Dagegen hilft jeder Commit oder ein manueller Start ("Run workflow").
name: Supabase Keepalive

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/resources?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Antwort HTTP $code"
          cat /tmp/out.json; echo
          test "$code" = "200"
