# Manuell nach einer Neuanlage starten; liest alle dauerhaften Slugs aus Supabase.
# Benötigte Actions-Secrets: SUPABASE_URL und SUPABASE_ANON_KEY.
name: QR-Codes aktualisieren

on:
  push:
    paths:
      - "data/seed.json"
      - "scripts/build_qr.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: QR-Bibliothek bereitstellen
        run: sudo apt-get update && sudo apt-get install -y python3-qrcode python3-pil
      - name: QR-Codes erzeugen
        env:
          QR_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 scripts/build_qr.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "QR-Codes aktualisiert"
            git push
          fi
