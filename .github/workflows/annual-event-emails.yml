name: Jährliche Ereignis-E-Mails

on:
  schedule:
    # Wie der funktionierende Testmail-Workflow: alle fünf Minuten.
    # Das Skript berechnet den Fälligkeitstag mit Europe/Berlin.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annual-event-reminders
  cancel-in-progress: false

jobs:
  send-annual-event-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Fällige Ereignis-E-Mails versenden
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRATO_SMTP_USER: ${{ secrets.STRATO_SMTP_USER }}
          STRATO_SMTP_PASSWORD: ${{ secrets.STRATO_SMTP_PASSWORD }}
        run: python3 scripts/send_annual_event_emails.py
